h1>CyberVault PAM</h1><small>Privileged Access Management • Learning Simulator</small></div></div><div class=\"profile\">👤  operator.demo　⌄</div></div>\n <div class=\"window\">\n  <div class=\"titlebar\"><div class=\"winname\"><span class=\"winicon\">🔐</span> CyberVault • Secure Access Workspace</div><div class=\"wincontrols\">—　□　×</div></div>\n  <div class=\"app\">\n   <aside class=\"sidebar\">\n    <div class=\"side-label\">WORKSPACE</div>\n    <button class=\"nav active\" data-page=\"dashboard\">▦　Dashboard</button>\n    <button class=\"nav\" data-page=\"connect\">⌁　SSH Connect</button>\n    <button class=\"nav\" data-page=\"vault\">▣　Credential Vault</button>\n    <button class=\"nav\" data-page=\"requests\">◷　Access Requests</button>\n    <button class=\"nav\" data-page=\"sessions\">▤　Session Monitor</button>\n    <button class=\"nav\" data-page=\"audit\">☷　Audit Trail</button>\n    <div class=\"side-label\">LEARNING</div>\n    <button class=\"nav\" data-page=\"guide\">ⓘ　Panduan Praktikum</button>\n    <div class=\"sidebar-note\">🛡️ <b>Mode edukasi</b><br>Seluruh server, akun, dan aktivitas di aplikasi ini adalah data simulasi. Tidak ada koneksi SSH sungguhan.</div>\n   </aside>\n   <main class=\"main\" id=\"main\"></main>\n  </div>\n </div>\n</div>\n<div class=\"taskbar\"><span>⊞</span><span>🔎 Search</span><span>▣ CyberVault PAM</span><span id=\"clock\"></span></div>\n</div>\n</div>\n<div class=\"monitor-neck\"></div><div class=\"monitor-base\"></div>\n<div class=\"modalback\" id=\"modalback\"><div class=\"modal\" id=\"modal\"></div></div><div class=\"toast\" id=\"toast\"></div>\n<script>\nconst accounts=[\n {id:'SSH-001',name:'Linux Production',host:'192.168.10.20',user:'root',key:'Password tersimpan',group:'Production',status:'Managed',last:'Hari ini, 09:14'},\n {id:'SSH-002',name:'Web Staging',host:'192.168.10.31',user:'deploy',key:'SSH private key',group:'Development',status:'Managed',last:'Kemarin, 16:40'},\n {id:'SSH-003',name:'Database Server',host:'192.168.10.45',user:'dbadmin',key:'Password tersimpan',group:'Database',status:'Managed',last:'24 Nov 2026, 13:02'}\n];\nlet sessions=[],logs=[{time:'09:14:22',user:'operator.demo',action:'Login ke portal PAM',target:'CyberVault',result:'Success'},{time:'09:15:03',user:'operator.demo',action:'Melihat daftar akun',target:'Credential Vault',result:'Success'}],requests=[];\nlet vaultSecrets={};\nlet currentPage='dashboard',selected='SSH-001',connected=false;\nconst main=document.getElementById('main');\nfunction toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}\nfunction log(action,target,result='Success'){logs.unshift({time:new Date().toLocaleTimeString('id-ID'),user:'operator.demo',action,target,result})}\nfunction nav(p){currentPage=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}\ndocument.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));\nfunction pagehead(title,sub,button=''){return `<div class=\"pagehead\"><div><h2>${title}</h2><div class=\"sub\">${sub}</div></div>${button}</div>`}\nfunction render(){\n if(currentPage==='dashboard')dashboard();\n if(currentPage==='connect')connect();\n if(currentPage==='vault')vault();\n if(currentPage==='requests')requestPage();\n if(currentPage==='sessions')sessionPage();\n if(currentPage==='audit')auditPage();\n if(currentPage==='guide')guide();\n}\nfunction dashboard(){main.innerHTML=pagehead('Dashboard','Ringkasan keamanan akses istimewa dan aktivitas sistem.')+`\n <div class=\"grid\">\n  <div class=\"stat\"><div class=\"k\">Managed Credentials</div><strong>03</strong><small>● Semua dikelola Vault</small></div>\n  <div class=\"stat\"><div class=\"k\">Active SSH Sessions</div><strong>${sessions.filter(s=>s.active).length.toString().padStart(2,'0')}</strong><small>● Sesi simulasi</small></div>\n  <div class=\"stat\"><div class=\"k\">Pending Requests</div><strong>${requests.filter(r=>r.status==='Pending').length.toString().padStart(2,'0')}</strong><small>● Perlu ditinjau</small></div>\n  <div class=\"stat\"><div class=\"k\">Audit Events</div><strong>${logs.length.toString().padStart(2,'0')}</strong><small>● Tercatat lokal</small></div>\n </div>\n <div class=\"two\"><section class=\"card\"><h3>🚀 Quick Access</h3><div class=\"notice\">Gunakan SSH Connect untuk memilih server dan membuka terminal simulasi. Password asli tidak pernah ditampilkan pada layar pengguna.</div><p><button class=\"btn primary\" onclick=\"nav('connect')\">Buka SSH Connect →</button></p><h3 style=\"margin-top:22px\">Managed SSH Accounts</h3>${accounts.map(a=>`<div class=\"server\"><div><b>${a.name}</b><small>${a.user}@${a.host}</small></div><span class=\"pill green\">Managed</span></div>`).join('')}</section>\n <section class=\"card\"><h3>🛡️ Security Controls</h3><div class=\"server\"><div><b>Credential Vaulting</b><small>Kredensial dikelola oleh PAM</small></div><span class=\"pill green\">Active</span></div><div class=\"server\"><div><b>Password Reveal</b><small>Rahasia tidak ditampilkan ke user</small></div><span class=\"pill green\">Blocked</span></div><div class=\"server\"><div><b>Session Recording</b><small>Aktivitas terminal simulasi</small></div><span class=\"pill amber\">Demo</span></div><div class=\"server\"><div><b>Access Approval</b><small>Persetujuan sebelum akses</small></div><span class=\"pill green\">Enabled</span></div></section></div>`}\nfunction connect(){main.innerHTML=pagehead('SSH Connect','Akses server melalui PAM tanpa mengetahui password atau private key asli.')+`\n <div class=\"two\"><section class=\"card\"><h3>1. Pilih target SSH</h3><div class=\"field\"><label>SERVER / MANAGED ACCOUNT</label><select id=\"target\">${accounts.map(a=>`<option value=\"${a.id}\" ${selected===a.id?'selected':''}>${a.name} — ${a.host}</option>`).join('')}</select></div><div id=\"targetinfo\"></div><div class=\"notice warn\" style=\"margin-top:15px\">🔒 <b>Credential isolation:</b> Password/private key disimpan di Vault. User hanya meminta sesi; PAM yang menggunakan kredensial untuk autentikasi ke server.</div><p><button class=\"btn primary\" id=\"connectbtn\" onclick=\"startSession()\">Connect via PAM</button> <button class=\"btn ghost\" onclick=\"showFlow()\">Lihat alur autentikasi</button></p></section>\n <section class=\"card\"><h3>2. Status koneksi</h3><div id=\"connectionstate\">${connected?'<span class=\"pill green\">Session active</span>':'<span class=\"pill amber\">Belum terhubung</span>'}</div><div class=\"terminal\"><div class=\"termhead\"><span>● PAM SSH TERMINAL</span><span>Encrypted channel • DEMO</span></div><div class=\"term\" id=\"terminal\"><span class=\"muted\">Belum ada sesi. Pilih target lalu klik “Connect via PAM”.</span></div></div><div class=\"row\" style=\"margin-top:12px\"><button class=\"btn green\" onclick=\"runCommand('whoami')\">whoami</button><button class=\"btn ghost\" onclick=\"runCommand('hostname')\">hostname</button><button class=\"btn ghost\" onclick=\"runCommand('ls -la')\">ls -la</button><button class=\"btn red\" onclick=\"endSession()\">End Session</button></div></section></div>\n <div class=\"card\" style=\"margin-top:15px\"><h3>Yang terjadi di belakang layar</h3><div class=\"row\"><div class=\"notice\">① User terautentikasi ke portal PAM</div><div class=\"notice\">② PAM mengambil secret dari Vault</div><div class=\"notice\">③ PAM membuka koneksi SSH ke target</div><div class=\"notice\">④ Sesi dicatat pada Audit Trail</div></div></div>`;\n document.getElementById('target').addEventListener('change',e=>{selected=e.target.value;connected=false;updateTargetInfo()});updateTargetInfo();}\nfunction updateTargetInfo(){\n let a=accounts.find(x=>x.id===selected),el=document.getElementById('targetinfo');\n let req=approvedRequestFor(a.name),sec=vaultSecrets[a.id];\n if(el)el.innerHTML=`<div class=\"server\"><div><b>${a.name}</b><small>Host: ${a.host}<br>Username: ${a.user}</small></div><span class=\"pill green\">Vault managed</span></div><div class=\"server\"><div><b>Credential reference</b><small>${sec?'Random password • Version '+sec.version:a.key}</small></div><span class=\"hiddenpass\">••••••••••••••••</span></div><div class=\"sub\">Secret ID: ${a.id} • Tidak dapat di-reveal oleh user</div><div style=\"margin-top:12px\">${req?'<span class=\"pill green\">Approved request tersedia</span>':'<span class=\"pill amber\">Belum ada approval aktif</span>'}</div>`;\n let btn=document.getElementById('connectbtn');\n if(btn){btn.disabled=!req;btn.style.opacity=req?'1':'.45';btn.title=req?'':'Buat dan approve Access Request terlebih dahulu';}\n}\nfunction startSession(){if(connected){toast('Sesi sudah aktif.');return}let a=accounts.find(x=>x.id===selected);let approval=approvedRequestFor(a.name);if(!approval||!vaultSecrets[a.id]){toast('Akses belum disetujui. Ajukan Access Request dan lakukan approval terlebih dahulu.');return}approval.used=true;connected=true;let id='SES-'+String(sessions.length+1).padStart(3,'0');sessions.unshift({id,target:a.name,host:a.host,user:a.user,start:new Date().toLocaleTimeString('id-ID'),active:true});log('SSH session started',a.name);document.getElementById('connectionstate').innerHTML='<span class=\"pill green\">● Session active • '+id+'</span>';document.getElementById('terminal').innerHTML=`<span class=\"prompt\">CyberVault PAM Gateway</span>\\n[OK] User operator.demo terautentikasi ke PAM\\n[OK] Access policy: APPROVED\\n[OK] Approved request: ${approval.id}\\n[OK] Random credential retrieved from Vault: <span class=\"hiddenpass\">[REDACTED]</span>\\n[OK] Password never exposed to requester\\n[OK] SSH authentication to ${a.host} as ${a.user}\\n[OK] Session ${id} established\\n\\n<span class=\"prompt\">${a.user}@${a.name.toLowerCase().replaceAll(' ','-')}:~$</span> _\\n\\n<span style=\"color:#7894b5\">Simulasi terminal. Perintah yang tersedia: whoami, hostname, ls -la, date</span>`;toast('Sesi SSH simulasi berhasil dibuka menggunakan password acak dari Vault.')}\nfunction runCommand(cmd){if(!connected){toast('Hubungkan ke server terlebih dahulu.');return}let a=accounts.find(x=>x.id===selected),out={whoami:a.user,hostname:a.name.toLowerCase().replaceAll(' ','-'),'ls -la':'drwxr-xr-x  4 root root 4096 .\\n-rw-r--r--  1 root root  220 .profile\\ndrwxr-xr-x  2 root root 4096 logs',date:new Date().toString()}[cmd];let t=document.getElementById('terminal');t.innerHTML+=`\\n<span class=\"prompt\">${a.user}@${a.name.toLowerCase().replaceAll(' ','-')}:~$</span> ${cmd}\\n${out}\\n<span class=\"prompt\">${a.user}@${a.name.toLowerCase().replaceAll(' ','-')}:~$</span> _`;t.scrollTop=t.scrollHeight;log('SSH command: '+cmd,a.name)}\nfunction endSession(){if(!connected){toast('Tidak ada sesi aktif.');return}connected=false;let s=sessions.find(x=>x.active);if(s)s.active=false;log('SSH session ended',s?s.target:'SSH');document.getElementById('connectionstate').innerHTML='<span class=\"pill amber\">Session closed</span>';document.getElementById('terminal').innerHTML+='\\n\\n[INFO] Session terminated by operator.demo\\n[OK] Session recording finalized.';toast('Sesi ditutup dan aktivitas dicatat.')}\nfunction showFlow(){modal(`<h3>Alur autentikasi SSH melalui PAM</h3><p><b>1.</b> User login ke PAM dengan identitasnya sendiri.<br><b>2.</b> PAM memeriksa kebijakan dan hak akses.<br><b>3.</b> PAM mengambil password/private key dari Vault secara internal.<br><b>4.</b> PAM atau SSH proxy mengautentikasi ke server tujuan.<br><b>5.</b> User berinteraksi melalui terminal perantara; secret tidak diberikan ke user.</p><div class=\"notice\">Catatan: implementasi nyata bergantung pada arsitektur produk. Pastikan jalur SSH langsung ke server dibatasi agar user tidak dapat melewati PAM.</div><div class=\"modalactions\"><button class=\"btn primary\" onclick=\"closeModal()\">Tutup</button></div>`)}\nfunction vault(){main.innerHTML=pagehead('Credential Vault','Buat akun privileged dengan username dan password acak otomatis.',`<button class=\"btn primary\" onclick=\"newAccount()\">+ Create Account</button>`)+`<div class=\"notice\" style=\"margin-bottom:15px\">🔐 Buat akun baru dengan menentukan username. Setiap akun yang dibuat akan memperoleh password acak baru 24 karakter yang langsung disimpan di Vault dan tidak ditampilkan kembali.</div><section class=\"card\"><div class=\"row\"><h3>Managed Credentials</h3><input id=\"searchvault\" placeholder=\"Cari server atau username...\" style=\"max-width:250px;background:#0c1727;border:1px solid #354965;border-radius:7px;color:white;padding:9px\"></div><div class=\"tablewrap\"><table><thead><tr><th>ID</th><th>Nama target</th><th>Host</th><th>Username</th><th>Secret</th><th>Status</th></tr></thead><tbody id=\"vaultrows\">${vaultRows(accounts)}</tbody></table></div></section>`;document.getElementById('searchvault').addEventListener('input',e=>document.getElementById('vaultrows').innerHTML=vaultRows(accounts.filter(a=>(a.name+a.host+a.user).toLowerCase().includes(e.target.value.toLowerCase()))))}\nfunction newAccount(){\n modal(`<h3>Create Privileged Account</h3><p>Buat identitas akun untuk server simulasi. Password 24 karakter akan dibuat otomatis dan disimpan di Vault.</p>\n <div class=\"field\"><label>NAMA SERVER / TARGET</label><input id=\"newacctname\" placeholder=\"Contoh: App Server Development\"></div>\n <div class=\"field\"><label>HOST / IP ADDRESS</label><input id=\"newaccthost\" placeholder=\"Contoh: 192.168.10.60\"></div>\n <div class=\"field\"><label>USERNAME BARU</label><input id=\"newacctuser\" placeholder=\"Contoh: app_operator\"></div>\n <div class=\"field\"><label>GROUP</label><select id=\"newacctgroup\"><option>Development</option><option>Production</option><option>Database</option><option>Infrastructure</option></select></div>\n <div class=\"notice\">Password akan dibuat otomatis saat tombol Create Account ditekan. Nilainya tidak diperlihatkan kepada requester; hanya PAM yang menggunakannya dari Vault.</div>\n <div class=\"modalactions\"><button class=\"btn ghost\" onclick=\"closeModal()\">Batal</button><button class=\"btn primary\" onclick=\"createAccount()\">Create + Generate Password</button></div>`);\n}\nfunction createAccount(){\n const name=document.getElementById('newacctname').value.trim();\n const host=document.getElementById('newaccthost').value.trim();\n const user=document.getElementById('newacctuser').value.trim();\n const group=document.getElementById('newacctgroup').value;\n if(!name||!host||!user){toast('Nama server, host, dan username wajib diisi.');return}\n if(accounts.some(a=>a.user.toLowerCase()===user.toLowerCase()&&a.host.toLowerCase()===host.toLowerCase())){toast('Username tersebut sudah terdaftar pada host ini.');return}\n const id='SSH-'+String(accounts.length+1).padStart(3,'0');\n const generated=randomSecret(24);\n accounts.push({id,name,host,user,key:'Random password',group,status:'Managed',last:'Belum pernah digunakan'});\n vaultSecrets[id]={value:generated,version:1,created:new Date().toLocaleString('id-ID')};\n log('Privileged account created; username assigned and random password generated',name+' ('+user+'@'+host+')');\n closeModal();vault();toast('Akun '+user+' berhasil dibuat. Password acak baru disimpan di Vault (masked).');\n}\nfunction vaultRows(arr){return arr.map(a=>{let sec=vaultSecrets[a.id];return `<tr><td>${a.id}</td><td>${a.name}</td><td>${a.host}</td><td>${a.user}</td><td><span class=\"hiddenpass\">••••••••••••••</span><br><small class=\"muted\">${sec?'Random • v'+sec.version:'Belum dibuat oleh approval'}</small></td><td><span class=\"pill green\">Managed</span></td></tr>`}).join('')}\nfunction randomSecret(length=24){\n const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*_-+=';\n let out='';\n if(window.crypto && crypto.getRandomValues){const bytes=new Uint8Array(length);crypto.getRandomValues(bytes);for(let b of bytes)out+=chars[b%chars.length];}\n else {for(let i=0;i<length;i++)out+=chars[Math.floor(Math.random()*chars.length)];}\n return out;\n}\nfunction approvedRequestFor(target){return requests.find(r=>r.target===target && r.status==='Approved' && r.secretGenerated && !r.used);}\nfunction requestPage(){main.innerHTML=pagehead('Access Requests','Ajukan akses, setujui permintaan, dan buat password acak yang disimpan di Vault.',`<button class=\"btn primary\" onclick=\"newRequest()\">+ New Request</button>`)+`<div class=\"notice\" style=\"margin-bottom:14px\">🔐 Saat permintaan disetujui, simulator membuat password acak kuat untuk akun target dan menyimpannya sebagai secret Vault. Password tidak ditampilkan kepada pemohon; PAM menggunakannya secara internal saat sesi SSH dibuka.</div><section class=\"card\"><h3>Daftar permintaan</h3><div class=\"tablewrap\"><table><thead><tr><th>Request ID</th><th>Pemohon</th><th>Target</th><th>Alasan</th><th>Status</th><th>Credential</th><th>Aksi</th></tr></thead><tbody>${requests.length?requests.map((r,i)=>`<tr><td>${r.id}</td><td>${r.user}</td><td>${r.target}</td><td>${r.reason}</td><td><span class=\"pill ${r.status==='Approved'?'green':r.status==='Rejected'?'amber':''}\">${r.status}</span></td><td>${r.secretGenerated?'<span class=\"pill green\">Generated • masked</span>':'<span class=\"muted\">Belum dibuat</span>'}</td><td>${r.status==='Pending'?`<button class=\"btn green\" onclick=\"decide(${i},'Approved')\">Approve + Generate</button> <button class=\"btn red\" onclick=\"decide(${i},'Rejected')\">Reject</button>`:r.status==='Approved'&&!r.used?`<button class=\"btn primary\" onclick=\"useRequest(${i})\">Gunakan untuk SSH</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan=\"7\" class=\"muted\">Belum ada permintaan akses. Klik New Request untuk memulai alur.</td></tr>'}</tbody></table></div></section><div class=\"card\" style=\"margin-top:14px\"><h3>Alur kontrol akses</h3><div class=\"row\"><div class=\"notice\">① User mengajukan akses</div><div class=\"notice\">② Approver menyetujui</div><div class=\"notice\">③ Password acak dibuat</div><div class=\"notice\">④ Secret disimpan di Vault</div><div class=\"notice\">⑤ PAM membuka SSH</div></div></div>`}\nfunction newRequest(){modal(`<h3>New Access Request</h3><p>Permintaan akses akan dicatat dan menunggu persetujuan dalam simulasi ini.</p><div class=\"field\"><label>SERVER</label><select id=\"reqtarget\">${accounts.map(a=>`<option>${a.name}</option>`).join('')}</select></div><div class=\"field\"><label>ALASAN AKSES</label><input id=\"reqreason\" placeholder=\"Contoh: pemeliharaan layanan\"></div><div class=\"modalactions\"><button class=\"btn ghost\" onclick=\"closeModal()\">Batal</button><button class=\"btn primary\" onclick=\"submitRequest()\">Kirim Request</button></div>`)}\nfunction submitRequest(){let reason=document.getElementById('reqreason').value.trim();if(!reason){toast('Alasan akses wajib diisi.');return}let target=document.getElementById('reqtarget').value;requests.unshift({id:'REQ-'+String(requests.length+1).padStart(3,'0'),user:'operator.demo',target,reason,status:'Pending'});log('Access request submitted',target);closeModal();requestPage();toast('Permintaan akses berhasil dibuat.')}\nfunction decide(i,status){\n let r=requests[i];r.status=status;\n if(status==='Approved'){\n   const acct=accounts.find(a=>a.name===r.target);\n   const secret=randomSecret(24);\n   vaultSecrets[acct.id]={value:secret,version:(vaultSecrets[acct.id]?.version||0)+1,created:new Date().toLocaleString('id-ID')};\n   r.secretGenerated=true;r.secretVersion=vaultSecrets[acct.id].version;r.used=false;\n   log('Request approved; random credential generated and stored in Vault',r.target);\n   requestPage();toast('Disetujui. Password acak 24 karakter dibuat dan disimpan di Vault (masked).');\n }else{log('Access request Rejected',r.target);requestPage();toast('Permintaan ditolak.')}\n}\nfunction useRequest(i){let r=requests[i];let a=accounts.find(x=>x.name===r.target);selected=a.id;nav('connect');toast('Target dipilih. Klik Connect via PAM untuk menggunakan credential Vault.')}\nfunction sessionPage(){main.innerHTML=pagehead('Session Monitor','Pantau sesi SSH yang sedang berjalan dan riwayat sesi.')+`<section class=\"card\"><h3>SSH Sessions</h3><table><thead><tr><th>Session ID</th><th>Target</th><th>Host</th><th>Username</th><th>Mulai</th><th>Status</th></tr></thead><tbody>${sessions.length?sessions.map(s=>`<tr><td>${s.id}</td><td>${s.target}</td><td>${s.host}</td><td>${s.user}</td><td>${s.start}</td><td><span class=\"pill ${s.active?'green':'amber'}\">${s.active?'Active':'Closed'}</span></td></tr>`).join(''):'<tr><td colspan=\"6\" class=\"muted\">Belum ada sesi. Mulai dari menu SSH Connect.</td></tr>'}</tbody></table></section><div class=\"notice\" style=\"margin-top:14px\">Session recording pada simulator ini direpresentasikan oleh pencatatan perintah dan event. Tidak ada rekaman jaringan atau terminal server nyata.</div>`}\nfunction auditPage(){main.innerHTML=pagehead('Audit Trail','Catatan aktivitas penting yang terjadi di dalam simulator.',`<button class=\"btn ghost\" onclick=\"exportCSV()\">↓ Export CSV</button>`)+`<section class=\"card\"><div class=\"row\"><h3>Event Log</h3><input id=\"auditsearch\" placeholder=\"Cari aktivitas...\" style=\"max-width:230px;background:#0c1727;border:1px solid #354965;border-radius:7px;color:white;padding:9px\"></div><table><thead><tr><th>Waktu</th><th>User</th><th>Aktivitas</th><th>Target</th><th>Hasil</th></tr></thead><tbody id=\"auditrows\">${auditRows(logs)}</tbody></table></section>`;document.getElementById('auditsearch').addEventListener('input',e=>document.getElementById('auditrows').innerHTML=auditRows(logs.filter(l=>(l.action+l.target+l.user).toLowerCase().includes(e.target.value.toLowerCase()))))}\nfunction auditRows(arr){return arr.map(l=>`<tr><td>${l.time}</td><td>${l.user}</td><td>${l.action}</td><td>${l.target}</td><td><span class=\"pill green\">${l.result}</span></td></tr>`).join('')}\nfunction exportCSV(){let rows=[['Waktu','User','Aktivitas','Target','Hasil'],...logs.map(l=>[l.time,l.user,l.action,l.target,l.result])];let csv=rows.map(r=>r.map(v=>'\"'+String(v).replaceAll('\"','\"\"')+'\"').join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cybervault-audit-demo.csv';a.click();URL.revokeObjectURL(a.href);toast('Audit CSV diekspor.')}\nfunction guide(){main.innerHTML=pagehead('Panduan Praktikum','Tujuan pembelajaran dan langkah eksplorasi fitur PAM.')+`<section class=\"card\"><h3>🎯 Tujuan pembelajaran</h3><ul class=\"muted\" style=\"line-height:1.9\"><li>Menjelaskan fungsi Privileged Access Management.</li><li>Memahami credential vaulting dan pemisahan identitas user dari akun privileged.</li><li>Menjelaskan bagaimana PAM dapat memfasilitasi SSH tanpa mengungkapkan secret.</li><li>Mengamati approval, session monitoring, dan audit trail.</li></ul><h3 style=\"margin-top:24px\">🧪 Langkah praktikum</h3><ol class=\"muted\" style=\"line-height:2\"><li>Buka <b>Credential Vault</b> dan amati metadata akun SSH.</li><li>Buka <b>Credential Vault</b>, klik <b>Create Account</b>, isi nama server, host, dan username. Password acak 24 karakter dibuat otomatis untuk setiap akun baru.</li><li>Buka <b>Access Requests</b>, klik New Request, pilih akun yang baru dibuat, dan isi alasan.</li><li>Klik <b>Approve</b> untuk menyetujui permintaan. Akun yang dibuat sudah memiliki password acak di Vault; proses approval memberi izin menggunakan akun tersebut.</li><li>Buka <b>Credential Vault</b> dan amati secret berstatus Random serta masked.</li><li>Kembali ke <b>SSH Connect</b>, pilih Linux Production, lalu klik Connect via PAM. PAM menggunakan secret dari Vault tanpa mengungkapkannya.</li><li>Jalankan perintah whoami, hostname, dan ls -la.</li><li>Buka <b>Session Monitor</b> dan amati sesi aktif.</li><li>Akhiri sesi, lalu periksa <b>Audit Trail</b>.</li><li>Buat permintaan akses di <b>Access Requests</b>, kemudian lakukan approve/reject.</li></ol><div class=\"notice warn\"><b>Pertanyaan diskusi:</b> Jika user tidak mengetahui password SSH, apa yang mencegah user mengakses server secara langsung di luar PAM? Bahas pembatasan jaringan, firewall, bastion/proxy, kebijakan akun, dan pengelolaan key.</div><h3 style=\"margin-top:22px\">⚠️ Batasan simulator</h3><p class=\"muted\">Ini adalah prototipe pembelajaran berbasis browser. Tidak terhubung ke CyberArk, Linux, SSH, jaringan, maupun Vault sungguhan. Username ditetapkan saat pembuatan akun dan password acak dibuat lokal di browser untuk setiap akun baru. Password tersebut bukan password server nyata. Semua data bersifat fiktif dan hanya berada di halaman selama sesi browser berlangsung.</p></section>`}\nfunction modal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalback').style.display='flex'}function closeModal(){document.getElementById('modalback').style.display='none'}\ndocument.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});\ndocument.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});\nrender();\n\u003c/script>\n</body></html>";

in-height:980px;padding:10px 6px 55px}.shortcuts{display:none}.window{margin:0;}.content{grid-template-columns:1fr}.config{border-right:0;border-bottom:1px solid #c8d1dc}.terminal{height:340px}.terminalpane{padding:12px}.monitor-neck{height:20px;width:80px}.monitor-base{width:150px;height:9px}}\n</style>\n</head>\n<body>\n<div class=\"monitor\">\n <div class=\"screen\">\n  <div class=\"desktop\">\n   <div class=\"shortcuts\"><div>🗑️<small>Recycle Bin</small></div><div>🌐<small>Microsoft Edge</small></div><div>📁<small>File Explorer</small></div></div>\n   <div class=\"window\">\n    <div class=\"titlebar\"><div class=\"titleleft\"><span class=\"puttyicon\">Pu</span><b>PuTTY Configuration — SSH Client Simulator</b></div><div class=\"winbtns\">— □ ×</div></div>\n    <div class=\"content\">\n     <section class=\"config\">\n      <h2>PuTTY Configuration</h2><div class=\"desc\">Simulasi klien SSH bergaya PuTTY untuk praktikum login manual.</div>\n      <div class=\"field\"><label>HOST NAME (OR IP ADDRESS)</label><select id=\"host\"><option value=\"192.168.10.20\">192.168.10.20 — Linux Production Lab</option><option value=\"192.168.10.31\">192.168.10.31 — Web Staging Lab</option><option value=\"192.168.10.45\">192.168.10.45 — Database Lab</option></select></div>\n      <div class=\"field\"><label>PORT</label><input id=\"port\" value=\"22\" readonly></div>\n      <div class=\"field\"><label>CONNECTION TYPE</label><select disabled><option>SSH</option></select></div>\n      <div class=\"field\"><label>LOGIN USERNAME</label><input id=\"username\" value=\"root\" placeholder=\"Masukkan username\"></div>\n      <div class=\"field\"><label>PASSWORD</label><input id=\"password\" type=\"password\" placeholder=\"Masukkan password SSH\"></div>\n      <div class=\"buttons\"><button class=\"btn primary\" id=\"openbtn\" onclick=\"connectSSH()\">Open</button><button class=\"btn\" onclick=\"resetForm()\">Reset</button></div>\n      <div class=\"help\"><b>Data latihan:</b><br>Username mengikuti server yang dipilih:<br>• 192.168.10.20: <code>root</code><br>• 192.168.10.31: <code>deploy</code><br>• 192.168.10.45: <code>dbadmin</code><br><br>Password demo: <code>DirectDemo!2026</code><br><br>Ini kredensial latihan fiktif, bukan password server nyata.</div>\n     </section>\n     <section class=\"terminalpane\">\n      <div class=\"termhead\"><span>SSH TERMINAL</span><span class=\"status\" id=\"status\">● DISCONNECTED</span></div>\n      <div class=\"terminal\" id=\"terminal\"><span class=\"termgreen\">PuTTY SSH Client Simulator</span>\nCopyright (c) Learning Lab\n\nConfiguration:\n  Protocol : SSH\n  Port     : 22\n\nPilih host, masukkan username dan password latihan,\nkemudian klik Open untuk memulai sesi.\n\n<span class=\"termyellow\">Catatan: aplikasi ini hanya mensimulasikan proses login SSH.</span></div>\n      <div class=\"cmdrow\"><button class=\"btn\" onclick=\"runCommand('whoami')\">whoami</button><button class=\"btn\" onclick=\"runCommand('hostname')\">hostname</button><button class=\"btn\" onclick=\"runCommand('pwd')\">pwd</button><button class=\"btn\" onclick=\"runCommand('ls -la')\">ls -la</button><button class=\"btn\" onclick=\"disconnectSSH()\">Disconnect</button></div>\n      <div class=\"below\">Mode praktikum: SSH langsung tanpa PAM. Pengguna memasukkan sendiri username dan password pada klien SSH. Tidak ada integrasi Vault atau approval pada aplikasi ini.</div>\n     </section>\n    </div>\n   </div>\n   <div class=\"taskbar\"><span>⊞</span><span>🔎 Search</span><span class=\"active\">▣ PuTTY SSH Client</span><span id=\"clock\"></span></div>\n  </div>\n </div>\n <div class=\"monitor-neck\"></div><div class=\"monitor-base\"></div>\n</div>\n<script>\nconst serverInfo={\n '192.168.10.20':{name:'linux-production-lab',user:'root'},\n '192.168.10.31':{name:'web-staging-lab',user:'deploy'},\n '192.168.10.45':{name:'database-lab',user:'dbadmin'}\n};\nlet connected=false,currentHost='',currentUser='';\nconst term=document.getElementById('terminal');\nfunction write(s){term.innerHTML+=s;term.scrollTop=term.scrollHeight}\nfunction connectSSH(){\n if(connected){write('\\n< span class=\"termyellow\">[INFO] Sesi sudah aktif.</span>');return}\n const host=document.getElementById('host').value, user=document.getElementById('username').value.trim(), pass=document.getElementById('password').value;\n if(!user||!pass){alert('Username dan password harus diisi.');return}\n if(user!==serverInfo[host].user){document.getElementById('status').textContent='● LOGIN FAILED';write('\\n\\n<span class=\"termred\">login as: '+escapeHtml(user)+'\\nAccess denied: username tidak sesuai untuk server demo.</span>');return}\n if(pass!=='DirectDemo!2026'){document.getElementById('status').textContent='● LOGIN FAILED';write('\\n\\n<span class=\"termred\">login as: '+escapeHtml(user)+'\\nAccess denied: password demo salah.</span>');return}\n connected=true;currentHost=host;currentUser=user;document.getElementById('status').textContent='● CONNECTED';document.getElementById('status').style.color='#16834d';\n write('\\n\\nlogin as: '+escapeHtml(user)+'\\nAuthenticating with password...\\n<span class=\"termgreen\">Access granted.</span>\\nConnected to '+host+':22 using SSH.\\n\\n<span class=\"prompt\">'+escapeHtml(user)+'@'+serverInfo[host].name+':~$</span> ');\n document.getElementById('password').value='';\n}\nfunction runCommand(cmd){\n if(!connected){alert('Belum login. Hubungkan ke server terlebih dahulu.');return}\n const outputs={whoami:currentUser,hostname:serverInfo[currentHost].name,pwd:'/home/'+currentUser,'ls -la':'total 16\\ndrwxr-xr-x  4 '+currentUser+' users 4096 .\\ndrwxr-xr-x  3 root  root  4096 ..\\n-rw-r--r--  1 '+currentUser+' users  220 .profile'};\n write(escapeHtml(cmd)+'\\n'+escapeHtml(outputs[cmd])+'\\n<span class=\"prompt\">'+escapeHtml(currentUser)+'@'+serverInfo[currentHost].name+':~$</span> ');\n}\nfunction disconnectSSH(){if(!connected){alert('Tidak ada sesi SSH aktif.');return}write('\\n<span class=\"termyellow\">Connection closed by user.</span>');connected=false;document.getElementById('status').textContent='● DISCONNECTED';document.getElementById('status').style.color='';}\nfunction resetForm(){if(connected)disconnectSSH();document.getElementById('password').value='';document.getElementById('username').value=serverInfo[document.getElementById('host').value].user;term.innerHTML='<span class=\"termgreen\">PuTTY SSH Client Simulator</span>\\nForm direset. Masukkan kredensial latihan untuk memulai sesi.'}\nfunction escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;').replaceAll(\"'\",\"&#39;\")}\ndocument.getElementById('host').addEventListener('change',e=>{document.getElementById('username').value=serverInfo[e.target.value].user;document.getElementById('password').value='';});\ndocument.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});\n\\u003c/script>\n</body></html>";
